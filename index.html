<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f9" />
    <meta
      name="description"
      content="Smart Study Timer — a calm, polished Pomodoro focus dashboard for students."
    />
    <title>Smart Study Timer</title>
    <script>
      (() => {
        try {
          const rawTheme = localStorage.getItem('smartStudyTimer.theme')
          const savedTheme = rawTheme ? JSON.parse(rawTheme) : null
          const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          const theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : systemTheme
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          document.querySelector('meta[name="theme-color"]').setAttribute(
            'content',
            theme === 'dark' ? '#0c1118' : '#f4f6f9',
          )
        } catch {
          const fallbackTheme = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = fallbackTheme
          document.documentElement.style.colorScheme = fallbackTheme
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
